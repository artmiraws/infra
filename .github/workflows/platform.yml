name: Platform dev

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars.example"
      - "modules/**"
      - "environments/**"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars.example"
      - "modules/**"
      - "environments/**"
      - ".github/workflows/platform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment root
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: Terraform action
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

# One platform run at a time per environment; the S3 state lock is the second line of defence.
concurrency:
  group: platform-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # workflow_dispatch picks the root; push/PR plans dev.
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  plan:
    # Dedicated self-hosted runner with its own (broad) IRSA role, separate from the app runner.
    runs-on: arc-infra-runner
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/tofu.zip \
            "https://github.com/opentofu/opentofu/releases/download/v1.11.5/tofu_1.11.5_linux_amd64.zip"
          unzip -q /tmp/tofu.zip -d "$HOME/.local/bin"
          if ! command -v aws >/dev/null 2>&1; then
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install -i "$HOME/.local/aws-cli" -b "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show identity (IRSA)
        run: aws sts get-caller-identity

      - name: Load platform config
        run: |
          set -euo pipefail
          {
            echo "TF_VAR_base_domain=$(aws ssm get-parameter --name /platform/base_domain --query Parameter.Value --output text)"
            echo "TF_VAR_budget_alert_emails=$(aws ssm get-parameter --name /platform/budget_alert_emails --query Parameter.Value --output text)"
          } >> "$GITHUB_ENV"

      - name: Init
        run: |
          set -euo pipefail
          BUCKET="todolist-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          tofu -chdir="environments/${TARGET_ENV}" init -input=false -backend-config="bucket=$BUCKET"

      - name: Plan
        run: tofu -chdir="environments/${TARGET_ENV}" plan -input=false -no-color -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: environments/${{ env.TARGET_ENV }}/tfplan
          if-no-files-found: error

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    runs-on: arc-infra-runner
    # Requires reviewers configured on the `platform` GitHub Environment.
    environment: platform
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/tofu.zip \
            "https://github.com/opentofu/opentofu/releases/download/v1.11.5/tofu_1.11.5_linux_amd64.zip"
          unzip -q /tmp/tofu.zip -d "$HOME/.local/bin"
          if ! command -v aws >/dev/null 2>&1; then
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install -i "$HOME/.local/aws-cli" -b "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Load platform config
        run: |
          set -euo pipefail
          {
            echo "TF_VAR_base_domain=$(aws ssm get-parameter --name /platform/base_domain --query Parameter.Value --output text)"
            echo "TF_VAR_budget_alert_emails=$(aws ssm get-parameter --name /platform/budget_alert_emails --query Parameter.Value --output text)"
          } >> "$GITHUB_ENV"

      - name: Init
        run: |
          set -euo pipefail
          BUCKET="todolist-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          tofu -chdir="environments/${TARGET_ENV}" init -input=false -backend-config="bucket=$BUCKET"

      - name: Apply
        run: tofu -chdir="environments/${TARGET_ENV}" apply -input=false -no-color -auto-approve
